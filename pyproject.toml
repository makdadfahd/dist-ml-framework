[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dist-ml-framework"
version = "0.1.0"
description = "A distributed ML framework"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "matplotlib",
    "torchvision"
]

[tool.setuptools.packages.find]
where = ["src"]
